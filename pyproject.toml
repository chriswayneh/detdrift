[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detdrift"
version = "0.4.0"
description = "Report which Sigma rules lose fields after a telemetry schema change."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Christopher Hickman" }]
requires-python = ">=3.12"
keywords = ["sigma", "detection", "schema", "telemetry", "security", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
detdrift = "detdrift.cli:app"

[project.urls]
Homepage = "https://github.com/chriswayneh/detdrift"
Issues = "https://github.com/chriswayneh/detdrift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
