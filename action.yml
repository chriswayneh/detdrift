name: detdrift
description: >
  Check whether detection rules lose fields after a telemetry schema change
  (Sigma default; optional KQL/SPL via dialect). Fails the job when IMPACTED
  rules match the optional severity filter.
author: Christopher Hickman

branding:
  icon: shield
  color: red

inputs:
  before:
    description: Path to before NDJSON file or directory
    required: true
  after:
    description: Path to after NDJSON file or directory
    required: true
  rules:
    description: Directory of rules (Sigma YAML; use dialect for *.kql / *.spl)
    required: true
  fail-on-severity:
    description: >
      Optional. Comma-separated Sigma levels (e.g. high,critical).
      When set, the step exits 1 only if an IMPACTED rule meets the filter.
      Leave empty to fail on any IMPACTED rule.
    required: false
    default: ""
  fail-on-tag:
    description: >
      Optional. Comma-separated tag substrings (e.g. attack.t1059).
      When set (alone or with fail-on-severity), only matching IMPACTED rules fail the step.
    required: false
    default: ""
  dialect:
    description: >
      Rule dialect for field extraction: sigma (default), kql, spl, or auto
      (per-file by extension). Passed to detdrift diff --dialect.
    required: false
    default: "sigma"
  python-version:
    description: Python version for setup-python
    required: false
    default: "3.12"
  working-directory:
    description: Working directory for the diff command (caller repo root by default)
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install detdrift from action
      shell: bash
      run: |
        set -euo pipefail
        pip install "${{ github.action_path }}"

    - name: Run detdrift diff
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DETDRIFT_BEFORE: ${{ inputs.before }}
        DETDRIFT_AFTER: ${{ inputs.after }}
        DETDRIFT_RULES: ${{ inputs.rules }}
        DETDRIFT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        DETDRIFT_FAIL_ON_TAG: ${{ inputs.fail-on-tag }}
        DETDRIFT_DIALECT: ${{ inputs.dialect }}
      run: |
        set -euo pipefail
        args=(
          diff
          --before "$DETDRIFT_BEFORE"
          --after "$DETDRIFT_AFTER"
          --rules "$DETDRIFT_RULES"
        )
        if [ -n "$DETDRIFT_FAIL_ON_SEVERITY" ]; then
          args+=(--fail-on-severity "$DETDRIFT_FAIL_ON_SEVERITY")
        fi
        if [ -n "$DETDRIFT_FAIL_ON_TAG" ]; then
          args+=(--fail-on-tag "$DETDRIFT_FAIL_ON_TAG")
        fi
        if [ -n "$DETDRIFT_DIALECT" ]; then
          args+=(--dialect "$DETDRIFT_DIALECT")
        fi
        detdrift "${args[@]}"
