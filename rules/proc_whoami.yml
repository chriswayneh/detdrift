title: Whoami Execution
id: detdrift-demo-whoami
status: experimental
description: Detects execution of whoami via process command line.
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\whoami.exe'
      - '/whoami'
    CommandLine|contains: 'whoami'
  condition: selection
level: low
falsepositives:
  - Legitimate admin troubleshooting
